<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="./index.html" />
    <script>
      if (window.location.protocol !== 'file:') document.querySelector('base').href = '/'
    </script>
    <link rel="preload" as="image" href="./assets/common/app-loading.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#15052e" />
    <title>App</title>
    <style>
      :root {
        --color-bg: #15052e;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--color-bg);
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--color-bg);
      }
      .boot-splash img {
        display: block;
        width: 60px;
        height: 60px;
        object-fit: contain;
      }
    </style>
    <script src="./config/app-config.js"></script>
    <script>
      ;(() => {
        const c = window.__ROOM_APP_CONFIG__ || {},
          t = c.theme || {}
        document.documentElement.lang = c.app?.defaultLocale || 'en'
        document.title = c.app?.documentTitle || 'App'
        if (t.primary) document.documentElement.style.setProperty('--color-primary', t.primary)
        if (t.secondary)
          document.documentElement.style.setProperty('--color-secondary', t.secondary)
        if (t.accent) document.documentElement.style.setProperty('--color-accent', t.accent)
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', t.primary || '#15052e')
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <img src="./assets/common/app-loading.svg" alt="" decoding="sync" fetchpriority="high" />
      </div>
    </div>
    <script type="module" src="./src/main/main.ts"></script>
  </body>
</html>
